<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#fff"/>
  <text x="20" y="40" text-anchor="start" font-weight="bold">1. Página do catálogo ou da obra</text>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="70" width="260" height="130"/>
    <rect x="340" y="70" width="260" height="130"/>
    <rect x="660" y="70" width="280" height="130"/>
    <rect x="1000" y="70" width="320" height="130"/>
    <rect x="1380" y="70" width="200" height="130"/>
  </g>
  <g stroke="#000" stroke-width="2" marker-end="url(#seta)">
    <line x1="280" y1="120" x2="338" y2="120"/>
    <line x1="600" y1="120" x2="658" y2="120"/>
    <line x1="940" y1="120" x2="998" y2="120"/>
    <line x1="1320" y1="120" x2="1378" y2="120"/>
  </g>
  <g stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#seta)">
    <path d="M1480,200 L1480,250 L150,250 L150,202" fill="none"/>
  </g>
  <text x="815" y="275" font-size="18">HTML renderizado no servidor, com a disponibilidade de cada obra</text>
  <text x="150" y="115">Navegador</text>
  <text x="150" y="145" font-size="18">GET /obras ou</text>
  <text x="150" y="170" font-size="18">/obras/[slug]</text>
  <text x="470" y="115">proxy.ts</text>
  <text x="470" y="145" font-size="18">nonce da CSP e</text>
  <text x="470" y="170" font-size="18">cabeçalhos</text>
  <text x="800" y="115">Página no servidor</text>
  <text x="800" y="145" font-size="18">catálogo: filtros, ordem</text>
  <text x="800" y="170" font-size="18">e página; obra: slug</text>
  <text x="1160" y="110">Módulo catalog</text>
  <text x="1160" y="138" font-size="18">entrada validada com Zod;</text>
  <text x="1160" y="163" font-size="18">só obras fora de rascunho;</text>
  <text x="1160" y="188" font-size="18">disponível se estoque &gt; 0</text>
  <text x="1480" y="125">PostgreSQL</text>
  <text x="1480" y="155" font-size="18">obras e artistas</text>
  <text x="20" y="350" text-anchor="start" font-weight="bold">2. Imagens da página</text>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="380" width="260" height="130"/>
    <rect x="460" y="380" width="380" height="130"/>
    <rect x="1020" y="380" width="300" height="130"/>
  </g>
  <g stroke="#000" stroke-width="2" marker-end="url(#seta)">
    <line x1="280" y1="425" x2="458" y2="425"/>
    <line x1="840" y1="425" x2="1018" y2="425"/>
  </g>
  <g stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#seta)">
    <line x1="1018" y1="470" x2="842" y2="470"/>
    <line x1="458" y1="470" x2="282" y2="470"/>
  </g>
  <text x="370" y="412" font-size="17">pedido da imagem</text>
  <text x="370" y="495" font-size="17">tamanho da tela</text>
  <text x="930" y="412" font-size="17">original</text>
  <text x="150" y="440">Navegador</text>
  <text x="150" y="470" font-size="18">só a primeira foto</text>
  <text x="150" y="495" font-size="18">com prioridade</text>
  <text x="650" y="430">/_next/image</text>
  <text x="650" y="462" font-size="18">redimensiona e converte para</text>
  <text x="650" y="487" font-size="18">formato moderno (RNF14)</text>
  <text x="1170" y="435">Cloudflare R2</text>
  <text x="1170" y="465" font-size="18">fotos enviadas pela</text>
  <text x="1170" y="490" font-size="18">gestão de obras</text>
</svg>
