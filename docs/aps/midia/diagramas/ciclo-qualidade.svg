<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1600" height="520" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="80" width="260" height="150"/>
    <rect x="340" y="80" width="260" height="150"/>
    <rect x="660" y="80" width="260" height="150"/>
    <rect x="980" y="80" width="260" height="150"/>
    <rect x="1300" y="80" width="280" height="150"/>
    <rect x="660" y="340" width="260" height="130"/>
  </g>
  <g stroke="#000" stroke-width="2" marker-end="url(#seta)">
    <line x1="280" y1="155" x2="338" y2="155"/>
    <line x1="600" y1="155" x2="658" y2="155"/>
    <line x1="920" y1="155" x2="978" y2="155"/>
    <line x1="1240" y1="155" x2="1298" y2="155"/>
    <line x1="790" y1="230" x2="790" y2="338"/>
    <path d="M1440,80 L1440,40 L470,40 L470,78" fill="none" stroke-dasharray="8 6"/>
  </g>
  <text x="955" y="30" font-size="17" font-style="italic">próxima rodada: mede de novo as métricas afetadas</text>
  <text x="150" y="130" font-weight="bold">1. Plano</text>
  <text x="150" y="165" font-size="18">requisitos na 25010,</text>
  <text x="150" y="190" font-size="18">GQM e metas fixadas</text>
  <text x="150" y="215" font-size="18">antes de medir</text>
  <text x="470" y="130" font-weight="bold">2. Linha de base</text>
  <text x="470" y="165" font-size="18">revisão b3587b3;</text>
  <text x="470" y="190" font-size="18">saídas brutas em</text>
  <text x="470" y="215" font-size="18">evidencias/baseline</text>
  <text x="790" y="130" font-weight="bold">3. Pontos críticos</text>
  <text x="790" y="165" font-size="18">métrica fora da meta</text>
  <text x="790" y="190" font-size="18">ou alerta a analisar,</text>
  <text x="790" y="215" font-size="18">ordenados por risco</text>
  <text x="1110" y="130" font-weight="bold">4. Melhoria</text>
  <text x="1110" y="165" font-size="18">baixo risco, por TDD;</text>
  <text x="1110" y="190" font-size="18">revisão por quem não</text>
  <text x="1110" y="215" font-size="18">escreveu o código</text>
  <text x="1440" y="130" font-weight="bold">5. Nova medição</text>
  <text x="1440" y="165" font-size="18">revisão 51bb1b8, mesmos</text>
  <text x="1440" y="190" font-size="18">comandos e máquina;</text>
  <text x="1440" y="215" font-size="18">antes e depois lado a lado</text>
  <text x="790" y="390" font-weight="bold">Propostas</text>
  <text x="790" y="422" font-size="18">pontos não tratados,</text>
  <text x="790" y="447" font-size="18">com a justificativa</text>
  <text x="810" y="290" font-size="16" text-anchor="start" font-style="italic">alto risco ou fora do escopo</text>
</svg>
