<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="#fff"/>
  <text x="20" y="36" text-anchor="start" font-weight="bold">Assistente público (RF20, RF21, RF23 a RF25)</text>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="60" width="170" height="80"/>
    <rect x="240" y="60" width="170" height="80"/>
    <rect x="460" y="60" width="170" height="80"/>
    <rect x="680" y="60" width="170" height="80"/>
    <rect x="900" y="60" width="170" height="80"/>
    <rect x="1120" y="60" width="170" height="80"/>
    <rect x="1340" y="60" width="240" height="80"/>
    <rect x="20" y="220" width="300" height="110"/>
    <rect x="400" y="220" width="380" height="110"/>
    <rect x="860" y="220" width="320" height="110"/>
    <rect x="1260" y="220" width="320" height="110"/>
  </g>
  <g stroke="#000" stroke-width="2" marker-end="url(#seta)">
    <line x1="190" y1="100" x2="238" y2="100"/>
    <line x1="410" y1="100" x2="458" y2="100"/>
    <line x1="630" y1="100" x2="678" y2="100"/>
    <line x1="850" y1="100" x2="898" y2="100"/>
    <line x1="1070" y1="100" x2="1118" y2="100"/>
    <line x1="1290" y1="100" x2="1338" y2="100"/>
    <path d="M1460,140 L1460,180 L170,180 L170,218" fill="none"/>
    <line x1="320" y1="275" x2="398" y2="275"/>
    <line x1="780" y1="275" x2="858" y2="275"/>
    <line x1="1180" y1="275" x2="1258" y2="275"/>
  </g>
  <text x="105" y="107">1. Nome</text>
  <text x="325" y="107">2. Artista</text>
  <text x="545" y="107">3. Estilo</text>
  <text x="765" y="97">4. Região</text>
  <text x="765" y="122">do corpo</text>
  <text x="985" y="107">5. Tamanho</text>
  <text x="1205" y="97">6. Data e</text>
  <text x="1205" y="122">horário</text>
  <text x="1460" y="97">7. Três avisos</text>
  <text x="1460" y="122" font-size="17">aceites obrigatórios</text>
  <text x="170" y="265">Revisão</text>
  <text x="170" y="295" font-size="17">dados da preferência</text>
  <text x="590" y="258">Servidor</text>
  <text x="590" y="286" font-size="17">limite de taxa por IP (RNF08)</text>
  <text x="590" y="311" font-size="17">e validação com Zod (RNF09)</text>
  <text x="1020" y="265">Link wa.me</text>
  <text x="1020" y="295" font-size="17">mensagem pré-preenchida</text>
  <text x="1420" y="265">WhatsApp</text>
  <text x="1420" y="295" font-size="17">o próprio cliente envia</text>
  <text x="800" y="368" font-size="17" font-style="italic">Nada do assistente é gravado: não há anamnese nem pedido de horário no banco (RN01, RNF18).</text>
  <line x1="20" y1="400" x2="1580" y2="400" stroke="#000" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="20" y="446" text-anchor="start" font-weight="bold">Agenda interna (RF22)</text>
  <g fill="none" stroke="#000" stroke-width="2">
    <rect x="20" y="480" width="380" height="140"/>
    <rect x="520" y="480" width="440" height="140"/>
    <rect x="1080" y="480" width="500" height="140"/>
  </g>
  <g stroke="#000" stroke-width="2" marker-end="url(#seta)">
    <line x1="400" y1="530" x2="518" y2="530"/>
    <line x1="960" y1="530" x2="1078" y2="530"/>
  </g>
  <g stroke="#000" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#seta)">
    <line x1="1078" y1="585" x2="962" y2="585"/>
    <line x1="518" y1="585" x2="402" y2="585"/>
  </g>
  <text x="210" y="530">Artista ou administração</text>
  <text x="210" y="560" font-size="17">combina o horário com o cliente</text>
  <text x="210" y="585" font-size="17">e cadastra início, fim e contato</text>
  <text x="740" y="530">Módulo scheduling</text>
  <text x="740" y="560" font-size="17">valida a entrada, o perfil e o artista</text>
  <text x="740" y="585" font-size="17">horário de São Paulo, gravado em UTC</text>
  <text x="1330" y="530">PostgreSQL</text>
  <text x="1330" y="560" font-size="17">restrição EXCLUDE USING gist</text>
  <text x="1330" y="585" font-size="17">recusa sobreposição do mesmo artista</text>
  <text x="460" y="608" font-size="15">gravado ou recusado</text>
  <text x="1020" y="608" font-size="15">conflito de horário</text>
</svg>
